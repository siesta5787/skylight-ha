[package]
name = "ha-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true }
# `wss://` needs an explicit TLS backend -- tokio-tungstenite doesn't enable
# one by default. rustls (not native-tls/OpenSSL) for the same
# static-musl-friendly reasons as reqwest below; webpki-roots (a bundled
# root CA store) rather than native-roots so it doesn't depend on the
# target system having its own CA trust store, matching this project's
# "nothing borrowed from the OS" approach (see docs/plan.md).
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
time.workspace = true
url.workspace = true
# rustls (pure Rust, no OpenSSL) keeps this friendly to static musl builds.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
