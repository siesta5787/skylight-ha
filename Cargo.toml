[workspace]
resolver = "2"
members = [
    "apps/skylight-ha",
    "crates/ha-client",
    "crates/dashboard-config",
    "crates/ui",
]

[workspace.package]
version = "0.10.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-tungstenite = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3", features = ["serde", "parsing", "formatting", "macros"] }
url = "2"
sha2 = "0.10"
# MD5 is not a security choice here -- the Subsonic API specifies it for its
# token auth (t = md5(password + salt)), so interoperating means using it.
md-5 = "0.10"
# Decoding album art. Already in the tree via Slint, so this mostly costs the
# extra decoder features rather than a new compile unit. default-features off
# deliberately: the full crate pulls in a dozen formats a music server will
# never serve.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
