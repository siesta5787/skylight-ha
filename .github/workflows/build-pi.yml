name: Build Pi binary (aarch64-musl)

on:
  # Manual only -- deliberately no `push:` trigger. A run takes 2-3.5h
  # regardless of caching (QEMU emulation tax, not something caching fixes),
  # and releases are built and published locally instead (see
  # `scripts/release.sh`), which is both faster on this machine and doesn't
  # burn CI minutes on every push. This workflow still exists as a fallback
  # build path -- e.g. from a machine without the local Docker/QEMU setup --
  # not as part of the normal release flow.
  workflow_dispatch:

# A superseded run is wasted hours.
concurrency:
  group: build-pi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # QEMU-emulated aarch64 builds are slow (this is a large dependency
      # tree), so cache cargo's registry and the target dir across runs.
      # Mounted into the container at the same paths Alpine's cargo expects.
      - name: Cache cargo registry and target dir
        uses: actions/cache@v4
        with:
          path: |
            .cache/cargo-registry
            target
          key: pi-build-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            pi-build-

      # Alpine's apk packages are built against musl, matching our target
      # exactly -- so building natively inside an emulated aarch64 Alpine
      # container gets us correctly-linked libinput/libudev for free,
      # instead of assembling a cross sysroot by hand.
      #
      # SKYLIGHT_GIT_SHA is passed in rather than letting build.rs ask git:
      # the container has no git installed, and a bind-mounted checkout would
      # trip git's "dubious ownership" check even if it did. See build.rs.
      - name: Build inside emulated aarch64 Alpine container
        run: |
          mkdir -p .cache/cargo-registry target
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}":/workspace -w /workspace \
            -v "${{ github.workspace }}/.cache/cargo-registry":/root/.cargo/registry \
            -e SKYLIGHT_GIT_SHA="$(git rev-parse --short=12 HEAD)" \
            alpine:3.20 sh -c '
              set -eu
              apk add --no-cache curl gcc libinput-dev eudev-dev libxkbcommon-dev pkgconf musl-dev linux-headers
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | \
                sh -s -- -y --profile minimal --default-toolchain stable
              . "$HOME/.cargo/env"
              cargo build --release -p skylight-ha \
                --no-default-features -F ui/backend-linuxkms
            '

      # Consumed by the manual reflash path (copy into pizero2-buildroot's
      # rootfs-overlay, then `make`) when this workflow is used as a fallback
      # for the normal local Docker build. Releases are no longer built or
      # published here -- see `scripts/release.sh`.
      - uses: actions/upload-artifact@v4
        with:
          name: skylight-ha-aarch64-linux-musl
          path: target/release/skylight-ha
          if-no-files-found: error
